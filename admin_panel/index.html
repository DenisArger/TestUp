<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель тестов — PocketBase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-brand">Админ-панель тестов</div>
            <div class="header-actions">
                <button id="btn-logout" class="btn btn-danger" style="display:none;">Выйти</button>
            </div>
        </header>

        <nav class="nav">
            <button class="nav-item active" data-tab="quizzes">Тесты</button>
            <button class="nav-item" data-tab="questions">Вопросы</button>
            <button class="nav-item" data-tab="attempts">Результаты</button>
        </nav>

        <main class="main">
            <section id="auth-view" class="view card">
                <h2>Вход в админ-панель</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Логин администратора</label>
                        <input type="email" id="login-email" name="email" required placeholder="admin@example.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Пароль</label>
                        <input type="password" id="login-password" name="password" required placeholder="••••••••">
                    </div>
                    <div id="login-error" class="error-msg" style="display:none;">Неверный логин или пароль.</div>
                    <button type="submit" class="btn btn-primary btn-block">Войти</button>
                </form>
            </section>

            <section id="panel-view" class="view" style="display:none;">
                <div class="toolbar">
                    <h1 id="page-title">Тесты</h1>
                    <button id="btn-add" class="btn btn-primary">+ Добавить</button>
                </div>

                <div id="view-loading" class="loading" style="display:none;">Загрузка...</div>
                <div id="view-error" class="error-msg" style="display:none;"></div>

                <div id="quizzes-view" class="tab-view active">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Название</th>
                                <th>Описание</th>
                                <th>Активен</th>
                                <th>Создан</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="quizzes-table-body"></tbody>
                    </table>
                </div>

                <div id="questions-view" class="tab-view" style="display:none;">
                    <div class="form-group inline">
                        <label for="quiz-select">Выберите тест:</label>
                        <select id="quiz-select"></select>
                    </div>
                    <div id="questions-empty" style="display:none; color:#666;">Выберите тест, чтобы увидеть вопросы.</div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Текст</th>
                                <th>Тип</th>
                                <th>Варианты</th>
                                <th>Правильный ответ</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="questions-table-body"></tbody>
                    </table>
                </div>

                <div id="attempts-view" class="tab-view" style="display:none;">
                    <div class="form-group inline">
                        <label for="attempt-quiz-select">Фильтр по тесту:</label>
                        <select id="attempt-quiz-select">
                            <option value="">Все тесты</option>
                        </select>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Имя</th>
                                <th>Балл</th>
                                <th>Макс. балл</th>
                                <th>Процент</th>
                                <th>Начало</th>
                                <th>Окончание</th>
                            </tr>
                        </thead>
                        <tbody id="attempts-table-body"></tbody>
                    </table>
                </div>
            </section>

            <div id="modal-overlay" class="modal-overlay" style="display:none;">
                <div class="modal">
                    <button class="modal-close" id="modal-close">&times;</button>
                    <div class="modal-body" id="modal-body"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/quizzes.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/attempts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
